[package]
name = "yggdrasil-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Accounts: password hashes and session tokens.
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10.9"
# One port for everything (Railway gives a service one): the game's files, the account API and
# the WebSockets.
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
futures-util = "0.3.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: numbers read exactly as JavaScript wrote them (islands, content), not a last bit off.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Postgres. Queries are checked at run time rather than build time, so building needs no database.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# The load test's client side.
tokio-tungstenite = "0.30.0"
