# Every push to beta or production, and every pull request into them, is checked by the test tiers
# (tests/AGENTS.md): the unit tier always (the client typechecks, builds and passes its unit tests;
# the Rust tests pass), the integration tier where it's asked for (the TypeScript rules against the
# Rust ones, then the Playwright suite playing the game against a real server and database).
# A push that passes is deployed to the Railway environment of the same name and checked live.
# A push to beta skips the integration tier, which takes half an hour and more here without a GPU:
# it runs on the developer's machine before every push. Pull requests, production and a manual run
# (workflow_dispatch) still play it. The stress tier needs a real GPU, so it runs on the developer's
# machine before a release, not here.
#
#   beta        push directly; deploys to https://ruinathegame-beta.up.railway.app
#   production  pull requests only (branch protection); deploys to https://ruinathegame-production.up.railway.app
#
# Each GitHub environment (beta, production) holds RAILWAY_TOKEN, that Railway environment's
# project token, and only accepts deployments from the branch of the same name.

name: CI/CD

on:
  push:
    branches: [beta, production]
  pull_request:
    branches: [beta, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The build copies the models, textures and fonts in: the real files, not their LFS pointers.
      - uses: ./.github/actions/lfs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The engine's WebAssembly (crates/engine-wasm): the browser's rules, which the unit tests and
      # the build load.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-wasm
      - name: The engine for the browser
        run: npm run engine
      - name: Unit tests
        run: npx vitest run --project unit
      # Code nothing uses fails the check (knip finds the pages through the build, and knip.json adds the tests and tools).
      - name: Dead code
        run: npx knip --no-progress
      # The one format (biome.json) and its light lint rules: npm run format fixes the format.
      - name: Format and lint
        run: npx biome ci .
      - name: Typecheck and build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The engine for the browser (crates/engine-wasm).
          targets: wasm32-unknown-unknown
      # The workspace at the root, its target/ beside it (rust-cache's default).
      - uses: Swatinem/rust-cache@v2
      # The one format (rustfmt.toml), and clippy's default lints as errors: the code holds none
      # today, and keeps it that way.
      - name: Lints
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      # In debug, with the dependencies optimized (the workspace's Cargo.toml): quicker to build than a
      # release test binary, which took most of this job's time while the tests run in seconds.
      - name: Unit tests
        run: cargo test --locked --workspace
      # The integration tier runs the server and checks the browser's rules against the Rust ones;
      # a push to beta doesn't play it (Railway builds its own server from the Dockerfile), so it
      # doesn't need these either.
      - name: Build
        if: github.event_name != 'push' || github.ref_name != 'beta'
        run: |
          cargo build --release --locked
          cargo build --release --locked -p ruina-engine-wasm --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push' || github.ref_name != 'beta'
        with:
          name: server-binaries
          retention-days: 3
          path: |
            target/release/ruina-server
            target/release/simcheck
            target/release/aicheck
            target/release/balance
            target/release/terraincheck
            target/release/worldcheck
            target/release/lifecheck
            target/release/engineprobe
            target/wasm32-unknown-unknown/release/ruina_engine_wasm.wasm

  # The suite plays the real game in a browser that draws in software here, so it's split across
  # four runners. They share the tests out by count, not time, so the one with the open world's
  # long walks takes 30 to 45 minutes on a slow runner while another takes 10; it gets an hour.
  # "Game tests" below is the one check to require.
  game:
    name: Game tests (${{ matrix.shard }}/4)
    needs: server
    if: github.event_name != 'push' || github.ref_name != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ruina
          POSTGRES_PASSWORD: ruina
          POSTGRES_DB: ruina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruina -d ruina"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # The game the tests play loads the real models, textures and fonts.
      - uses: ./.github/actions/lfs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: server-binaries
          path: target
      - run: chmod +x target/release/*
      # The TypeScript rules against the Rust ones, through the check programs (tests/conformance):
      # no browser, so once, on the first runner.
      - name: TypeScript against Rust
        if: matrix.shard == 1
        run: npx vitest run --project conformance
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Start the game server
        env:
          DATABASE_URL: postgres://ruina:ruina@localhost:5432/ruina
          DEV_LOGIN: '1'
        run: |
          nohup target/release/ruina-server --port 7777 > server.log 2>&1 &
          for i in $(seq 60); do curl -fs localhost:7777/api/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Play the game
        # tests/integration/update.spec.ts stops and starts a game server of its own, on this database.
        env:
          RUINA_DATABASE_URL: postgres://ruina:ruina@localhost:5432/ruina
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  game-result:
    name: Game tests
    needs: game
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A push to beta doesn't play them (above); anywhere else every part has to pass.
      - name: Every part passed
        run: |
          test "${{ needs.game.result }}" = success && exit 0
          test "${{ needs.game.result }}" = skipped && test "${{ github.event_name }}" = push && test "${{ github.ref_name }}" = beta && exit 0
          exit 1

  deploy:
    name: Deploy
    needs: [client, server, game-result]
    # Says what must have passed rather than leaving it to success(), which a job skipped further up
    # (the game tests, on a push to beta) turns false.
    if: >-
      !cancelled() && needs.client.result == 'success' && needs.server.result == 'success' &&
      needs.game-result.result == 'success' && github.event_name != 'pull_request' &&
      (github.ref_name == 'beta' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.live.outputs.url }}
    # One deploy at a time per environment, and never cut one off halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Until the environment has its key, deploying is skipped (with a warning) rather than failed.
      - name: Check the Railway key
        id: key
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Not deployed: RAILWAY_TOKEN is not set for the ${{ github.ref_name }} environment (Settings > Environments > ${{ github.ref_name }} > Environment secrets: that Railway environment's project token)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'
      # Railway builds what this uploads, so the real files go up, not their LFS pointers.
      - uses: ./.github/actions/lfs
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Upload and build on Railway
        if: steps.key.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "since=$(date -u +%s)" >> "$GITHUB_ENV"
          npx --yes @railway/cli@5 up --ci --service ruina_the_game --environment ${{ github.ref_name }}
      - name: Wait until it's live
        if: steps.key.outputs.ready == 'true'
        id: live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node .github/scripts/railway-wait.mjs "$since"
