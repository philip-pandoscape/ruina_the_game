# Every push to beta or production, and every pull request into them, is checked: the client
# typechecks and builds, the Rust server's tests pass, and the Playwright suite plays the game
# against a real server and database (the battlefield and TS/Rust conformance tests included).
# A push that passes is deployed to the Railway environment of the same name and checked live.
# For now a push to beta skips the Playwright suite, which takes half an hour and more here without
# a GPU: it runs on the developer's machine before every push. Pull requests, production and a
# manual run (workflow_dispatch) still play it.
#
#   beta        push directly; deploys to https://ruinathegame-beta.up.railway.app
#   production  pull requests only (branch protection); deploys to https://ruinathegame-production.up.railway.app
#
# Each GitHub environment (beta, production) holds RAILWAY_TOKEN, that Railway environment's
# project token, and only accepts deployments from the branch of the same name.

name: CI/CD

on:
  push:
    branches: [beta, production]
  pull_request:
    branches: [beta, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Unit tests
        run: cargo test --release --locked --manifest-path server/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      # The game tests run the server, and check the browser's rules against the Rust ones.
      - uses: actions/upload-artifact@v7
        with:
          name: server-binaries
          retention-days: 3
          path: |
            server/target/release/yggdrasil-server
            server/target/release/simcheck
            server/target/release/aicheck
            server/target/release/balance
            server/target/release/terraincheck
            server/target/release/worldcheck
            server/target/release/lifecheck

  # The suite plays the real game in a browser that draws in software here, so it's split across
  # four runners. They share the tests out by count, not time, so the one with the open world's
  # long walks takes 30 to 45 minutes on a slow runner while another takes 10; it gets an hour.
  # "Game tests" below is the one check to require.
  game:
    name: Game tests (${{ matrix.shard }}/4)
    needs: server
    if: github.event_name != 'push' || github.ref_name != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ruina
          POSTGRES_PASSWORD: ruina
          POSTGRES_DB: ruina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruina -d ruina"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: server-binaries
          path: server/target/release
      - run: chmod +x server/target/release/*
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Start the game server
        env:
          DATABASE_URL: postgres://ruina:ruina@localhost:5432/ruina
          DEV_LOGIN: '1'
        run: |
          nohup server/target/release/yggdrasil-server --battle off --port 7777 > server.log 2>&1 &
          for i in $(seq 60); do curl -fs localhost:7777/api/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Play the game
        # tests/update.spec.ts stops and starts a game server of its own, on this database.
        env:
          RUINA_DATABASE_URL: postgres://ruina:ruina@localhost:5432/ruina
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  game-result:
    name: Game tests
    needs: game
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A push to beta doesn't play them (above); anywhere else every part has to pass.
      - name: Every part passed
        run: |
          test "${{ needs.game.result }}" = success && exit 0
          test "${{ needs.game.result }}" = skipped && test "${{ github.event_name }}" = push && test "${{ github.ref_name }}" = beta && exit 0
          exit 1

  deploy:
    name: Deploy
    needs: [client, server, game-result]
    if: github.event_name != 'pull_request' && (github.ref_name == 'beta' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.live.outputs.url }}
    # One deploy at a time per environment, and never cut one off halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Until the environment has its key, deploying is skipped (with a warning) rather than failed.
      - name: Check the Railway key
        id: key
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Not deployed: RAILWAY_TOKEN is not set for the ${{ github.ref_name }} environment (Settings > Environments > ${{ github.ref_name }} > Environment secrets: that Railway environment's project token)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Upload and build on Railway
        if: steps.key.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "since=$(date -u +%s)" >> "$GITHUB_ENV"
          npx --yes @railway/cli@5 up --ci --service ruina_the_game --environment ${{ github.ref_name }}
      - name: Wait until it's live
        if: steps.key.outputs.ready == 'true'
        id: live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node .github/scripts/railway-wait.mjs "$since"
