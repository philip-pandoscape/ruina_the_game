# Every push to beta or production, and every pull request into them, is checked: the client
# typechecks and builds, the Rust server's tests pass, and the Playwright suite plays the game
# against a real server and database (the battlefield and TS/Rust conformance tests included).
# A push that passes is deployed to the Railway environment of the same name and checked live.
#
#   beta        push directly; deploys to https://ruinathegame-beta.up.railway.app
#   production  pull requests only (branch protection); deploys to https://ruinathegame-production.up.railway.app
#
# Each GitHub environment (beta, production) holds RAILWAY_TOKEN, that Railway environment's
# project token, and only accepts deployments from the branch of the same name.

name: CI/CD

on:
  push:
    branches: [beta, production]
  pull_request:
    branches: [beta, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Unit tests
        run: cargo test --release --locked --manifest-path server/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      # The game tests run the server, and check the browser's rules against the Rust ones.
      - uses: actions/upload-artifact@v7
        with:
          name: server-binaries
          retention-days: 3
          path: |
            server/target/release/yggdrasil-server
            server/target/release/simcheck
            server/target/release/aicheck
            server/target/release/balance

  game:
    name: Game tests
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ruina
          POSTGRES_PASSWORD: ruina
          POSTGRES_DB: ruina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruina -d ruina"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: server-binaries
          path: server/target/release
      - run: chmod +x server/target/release/*
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Start the game server
        env:
          DATABASE_URL: postgres://ruina:ruina@localhost:5432/ruina
          DEV_LOGIN: '1'
        run: |
          nohup server/target/release/yggdrasil-server --bots 0 --port 7777 > server.log 2>&1 &
          for i in $(seq 60); do curl -fs localhost:7777/api/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Play the game
        run: npx playwright test
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [client, server, game]
    if: github.event_name != 'pull_request' && (github.ref_name == 'beta' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.live.outputs.url }}
    # One deploy at a time per environment, and never cut one off halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check the Railway key
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set for the ${{ github.ref_name }} environment (Settings > Environments > ${{ github.ref_name }} > Environment secrets): that Railway environment's project token."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Upload and build on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "since=$(date -u +%s)" >> "$GITHUB_ENV"
          npx --yes @railway/cli@5 up --ci --service ruina_the_game --environment ${{ github.ref_name }}
      - name: Wait until it's live
        id: live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node .github/scripts/railway-wait.mjs "$since"
