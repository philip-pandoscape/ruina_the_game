# Ruina's Rust, one workspace (one target/, here at the root):
#   crates/engine   the rules: movement, traversal, combat, skills, creatures, the island's life
#                   systems and the mini-games, as the browser's TypeScript runs them (and, in time,
#                   the browser's own copy of them). serde, serde_json and libm only: no clocks, no
#                   threads, no I/O.
#   crates/engine-wasm  the engine for the browser: compiled to WebAssembly, called through plain
#                   functions (src/engine/wasm.ts).
#   crates/world-api  the messages between the server's tiers (gate, simulations, store, social,
#                   directory), their ids, ticks and epochs: serde types, no I/O.
#   crates/server   the game server, ruina-server: accounts, characters and islands in Postgres, the
#                   world's channels and dungeon copies, its WebSocket.
#   crates/tools    programs run by hand or by the tests: the TypeScript-against-Rust checks, the
#                   balance harness.
#   crates/wire     what a browser hears of the world: records per cell, handles, deltas against what
#                   it acknowledged, byte budgets (no I/O; src/net/wire is the browser's side).
[workspace]
members = ["crates/engine", "crates/engine-wasm", "crates/server", "crates/tools", "crates/wire", "crates/world-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ruina-engine = { path = "crates/engine" }
ruina-engine-wasm = { path = "crates/engine-wasm" }
ruina-server = { path = "crates/server" }
ruina-wire = { path = "crates/wire" }
ruina-world-api = { path = "crates/world-api" }
futures-util = "0.3.34"
# The browser's exp and atan2 (fdlibm, as V8's are), so the rules both sides run agree to the bit.
libm = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: numbers read exactly as JavaScript wrote them (islands, content), not a last bit off.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

# Debug builds and the tests (npm run test:rust): our own code unoptimized, so a change rebuilds
# quickly; the dependencies optimized, built once and kept, so the tests run fast on them. Line
# tables are all a backtrace needs, and less debug info makes the build and its link quicker.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
