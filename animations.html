<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero animations</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #9fc9dc; overflow: hidden; font: 13px system-ui, sans-serif; }
      canvas { display: block; }
      #side { position: fixed; left: 0; top: 0; bottom: 0; width: 196px; overflow-y: auto; background: rgba(23, 30, 40, 0.82); color: #dfe6ee; padding: 8px 0; }
      #side h3 { margin: 10px 12px 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8fa3b8; }
      #side button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 4px 14px; font: inherit; cursor: pointer; }
      #side button:hover { background: rgba(255, 255, 255, 0.08); }
      #side button.on { background: #3a6ea5; color: #fff; }
      #bar { position: fixed; left: 208px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      #bar select, #bar button { font: inherit; padding: 3px 8px; border-radius: 6px; border: 1px solid #6c7a89; background: rgba(255, 255, 255, 0.85); color: #1d2733; cursor: pointer; }
      #label { position: fixed; left: 208px; bottom: 8px; font: 12px ui-monospace, monospace; color: #1d2733; background: rgba(255, 255, 255, 0.7); padding: 3px 8px; border-radius: 6px; }
      body.sheet #side, body.sheet #bar, body.sheet #label { display: none; }
    </style>
  </head>
  <body>
    <div id="side"></div>
    <div id="bar"></div>
    <div id="label"></div>
    <script type="module" src="/src/render/detail/animations.ts"></script>
  </body>
</html>
