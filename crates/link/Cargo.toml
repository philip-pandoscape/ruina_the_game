[package]
name = "ruina-link"
description = "Links between Ruina's server processes: serde messages over TCP, framed, numbered, acknowledged and sent again across lost connections, so each arrives once and in order"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# What the tiers say to each other (world-api's Transport, carried over links: post.rs).
ruina-world-api.workspace = true
# Frames are read into one buffer and handed on as slices of it, never copied again.
bytes = "1.12.1"
# A message's body: MessagePack with field names (self-describing, so world-api's messages cross as
# they are, serde_json::Value, tagged enums, skipped fields and all), or JSON (codec.rs).
rmp-serde = "1.3.1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
# Measured against (tests/numbers.rs): what a format that needs a schema would save.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ruina-engine.workspace = true
