[package]
name = "ruina-tools"
description = "Programs run by hand or by the tests: the WebAssembly's and the ground's checks against the native engine, the balance harness"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# With the tests' fixture worlds, for terraincheck --world (tests/conformance/world.test.ts).
ruina-engine = { workspace = true, features = ["fixture-world"] }
ruina-engine-wasm.workspace = true
ruina-server.workspace = true
serde.workspace = true
serde_json.workspace = true
