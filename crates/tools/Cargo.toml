[package]
name = "ruina-tools"
description = "Programs run by hand or by the tests: the WebAssembly's and the ground's checks against the native engine, the balance harness, the load harness"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# With the tests' fixture worlds, for terraincheck --world (tests/conformance/world.test.ts).
ruina-engine = { workspace = true, features = ["fixture-world"] }
ruina-engine-wasm.workspace = true
# What a browser's input bytes mean (the balance harness drives fighters with them).
ruina-world-api.workspace = true
serde.workspace = true
serde_json.workspace = true
# The load harness (src/bin/loadtest.rs): virtual clients on real WebSocket connections to a
# running world server. The same tokio-tungstenite the server's axum is built on.
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.29.0"
