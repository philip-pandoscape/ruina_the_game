<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yggdrasil</title>
    <link rel="icon" href="data:," />
    <style>
      /* Enough to paint the first frame; the UI's look is in src/ui/theme/. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; }
      body { color: #fff; user-select: none; }
      #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- Drawn over the world, so they follow it rather than the UI's scale. -->
    <div id="dummy-hp"><div class="fill"></div></div>
    <div id="target-plate"><span class="name"></span><div class="bar"><div class="fill"></div></div><div class="cast"><div class="fill"></div><span class="label"></span></div></div>
    <!-- The UI: laid out on a virtual screen and scaled to the window (src/ui/theme/scale.ts). -->
    <div id="ui">
      <div id="stats"></div>
      <div id="hint"></div>
      <div id="player-hp"><div class="fill"></div><span class="label"></span></div>
      <div id="abilities"></div>
      <div id="castbar"><div class="fill"></div><span class="label"></span></div>
      <div id="skills" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
